name: Refresh Profile

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
        
      - name: Generate Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_stats.py
        
      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py
        
      - name: Run Linters (Garde-fou)
        run: |
          python scripts/lint_i18n.py
          npx markdownlint-cli2@0.23.2 "**/*.md"
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.fr.md assets/stats/github-stats.svg
          if git diff --staged --quiet; then
            echo "No meaningful changes to commit."
          else
            git commit -m "docs: auto-refresh profile stats and content"
            git push
          fi
