name: Bug Report
description: Report a bug or dead link in the profile repository.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug or broken link clearly.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Broken URL / File
      description: If applicable, provide the broken link or the file path.
    validations:
      required: false
